name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Build installer and verify packaged RAOP host
        type: boolean
        default: false
      installer_lifecycle:
        description: Test the draft release installers on a disposable Windows runner
        type: boolean
        default: false
      release_tag:
        description: Release whose exact installer assets should be tested
        type: string
        default: v1.0.3

permissions:
  contents: read

jobs:
  installer-lifecycle:
    name: Installer lifecycle
    if: github.event_name == 'workflow_dispatch' && inputs.installer_lifecycle
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      # GitHub requires push access to download unpublished draft assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Download exact release and prior-version installers
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Path artifacts/release-under-test, artifacts/prior-release -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir artifacts/release-under-test --pattern AirBridge-Setup.exe --pattern AirBridge.msi --pattern release-validation.json --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download v1.0.2 --repo $env:GITHUB_REPOSITORY --dir artifacts/prior-release --pattern AirBridge.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise install, bundle UI, upgrade, repair, downgrade, and uninstall
        shell: powershell
        run: ./scripts/installer-qa.ps1 -ArtifactDirectory artifacts/release-under-test -PriorMsi artifacts/prior-release/AirBridge.msi -OutputDirectory artifacts/qa/installer-lifecycle
      - name: Upload installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-lifecycle
          path: artifacts/qa/installer-lifecycle/
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/AirBridge.RaopHost/requirements.lock.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Bootstrap isolated development environment
        shell: powershell
        run: ./scripts/bootstrap.ps1 -OutputDirectory artifacts/qa/ci-bootstrap

      - name: Run shared verification and snapshot matrix
        shell: powershell
        run: ./scripts/verify.ps1 -Snapshots -OutputDirectory artifacts/qa/ci-verify

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification
          path: |
            artifacts/qa/**/*.json
            artifacts/qa/**/*.log
            artifacts/qa/**/*.trx
            artifacts/qa/**/*.png
            artifacts/qa/**/session.json
            artifacts/qa/**/app-session.json
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: Chromium extension QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Restore locked browser QA dependencies
        run: npm ci --no-audit --no-fund
      - name: Install disposable runner Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise the actual unpacked extension
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-extension-qa
          path: |
            artifacts/browser-qa/report.json
            artifacts/browser-qa/**/*.png
            artifacts/browser-qa/**/*.zip
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package smoke
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: [test, browser-e2e]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Build installer with shared release gate and host ping
        shell: powershell
        run: ./scripts/package.ps1 -OutputDirectory artifacts/qa/ci-package
      - name: Upload package smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-smoke
          path: |
            artifacts/AirBridge-Setup.exe
            artifacts/AirBridge.msi
            artifacts/qa/**/*.json
            artifacts/qa/**/*.log
            artifacts/qa/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  deterministic-agent-evals:
    name: Deterministic agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore eval dependencies
        run: dotnet restore tests/AirBridge.Evals/AirBridge.Evals.csproj

      - name: Run deterministic agent evals
        run: dotnet test tests/AirBridge.Evals --no-restore --configuration Release

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
