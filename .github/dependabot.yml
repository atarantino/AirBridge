version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /src/AirBridge.RaopHost
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # pydantic pins pydantic-core exactly; they must move together.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
